name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-15-intel, macos-26]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container != '' && '--privileged' || '' }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: brew test-bot --only-cleanup-before

      - working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: brew test-bot --only-setup

      - working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: brew test-bot --only-tap-syntax

      - working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Validate desktop cask
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        if: runner.os == 'macOS'
        run: |
          brew style Casks/lunaris.rb
          brew audit --cask LunarisApp/tap/lunaris
          brew fetch --cask LunarisApp/tap/lunaris

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: "${{ steps.set-up-homebrew.outputs.repository-path }}/*.bottle.*"
